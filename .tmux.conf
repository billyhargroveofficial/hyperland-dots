# Custom tmux configuration
# Change prefix from C-b to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Basic settings
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Случайные «серверные» имена для окон и сессий — см. .config/tmux/.
# #{q:VAR} — официальный quoting-модификатор, экранирует sh-спецсимволы,
# в т.ч. $ в session_id вида $0 (иначе bash раскрыл бы его в имя шелла).
# session-created передаёт #{q:hook_session}; для initial-окна в свежей
# сессии (after-new-window для него не срабатывает) скрипт сам ренеймит :^.
# after-new-window передаёт #{q:window_id} нового окна.
set -g automatic-rename off
set -g allow-rename off
set-hook -g session-created  'run-shell "~/.config/tmux/rename-random.sh session #{q:hook_session}"'
set-hook -g after-new-window 'run-shell "~/.config/tmux/rename-random.sh window #{q:window_id}"'

# Kimi Code требует расширенные keycodes, иначе Enter/модифицированный Enter
# в его TUI не доходит до приложения.
set -g extended-keys on
set -s extended-keys-format csi-u

# History
set -g history-limit 10000

# Escape time
set -sg escape-time 0

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Navigation between panes within a window/tab
bind -r Left select-pane -L
bind -r Down select-pane -D
bind -r Up select-pane -U
bind -r Right select-pane -R

# Alternative pane navigation removed (vim-style disabled)

# Resizing with Shift+arrow keys
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5
bind -r S-Right resize-pane -R 5

# Navigation between windows/tabs
bind -r C-Left previous-window
bind -r C-Right next-window

# Prefix + PageUp/PageDown for tab switching
bind -r PPage previous-window
bind -r NPage next-window

# Quick window switching by F-keys (no prefix needed)
bind -n F1 select-window -t 1
bind -n F2 select-window -t 2
bind -n F3 select-window -t 3
bind -n F4 select-window -t 4
bind -n F5 select-window -t 5
bind -n F6 select-window -t 6
bind -n F7 select-window -t 7
bind -n F8 select-window -t 8
bind -n F9 select-window -t 9
bind -n F10 select-window -t 10

# Simple left/right navigation without prefix
bind -n S-Left previous-window
bind -n S-Right next-window

# Ctrl+PageUp/PageDown for tab switching (no prefix needed)
bind -n C-PPage previous-window
bind -n C-NPage next-window

# Quick window switching by number (with prefix)
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10

# Window creation
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Copy mode (vim-style disabled)
setw -g mode-keys emacs
bind [ copy-mode

# === Status bar: Catppuccin Mocha, сверху, прозрачные промежутки, закруглённые островки ===
set -g status-position top
set -g status-justify left
set -g status-interval 5

# bg=default — терминал просвечивает (берёт прозрачность/блюр Ghostty)
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left-length 100
set -g status-right-length 100

# Окна (вкладки): закруглённые powerline-сегменты на прозрачном фоне.
# Глифы: U+E0B6 (левый полукруг) и U+E0B4 (правый полукруг) — нужен Nerd Font.
setw -g window-status-style "bg=default,fg=default"
setw -g window-status-current-style "bg=default,fg=default"
# #(...) с #{window_id} в аргументе: tmux раскрывает формат ДО запуска, поэтому
# каждое окно получает свой вызов и свой результат — иначе все вкладки показали
# бы агента одного окна. Скрипт молчит, когда агента в окне нет.
setw -g window-status-format "#[fg=#313244,bg=default,nobold]#[fg=#cdd6f4,bg=#313244] #W#(~/.config/tmux/agent-win.sh #{window_id}) #[fg=#313244,bg=default,nobold]"
setw -g window-status-current-format "#[fg=#cba6f7,bg=default,nobold]#[fg=#11111b,bg=#cba6f7,bold] #W#(~/.config/tmux/agent-win.sh #{window_id}) #[fg=#cba6f7,bg=default,nobold]"
setw -g window-status-separator " "

# Слева — бейдж сессии (зелёный)
set -g status-left "#[fg=#a6e3a1,bg=default,nobold]#[fg=#11111b,bg=#a6e3a1,bold] #S #[fg=#a6e3a1,bg=default,nobold] "

# Справа — время (surface1) и хост (жёлтый)
set -g status-right "#{?client_prefix,#[fg=#f38ba8#,bg=default#,nobold]#[fg=#11111b#,bg=#f38ba8#,bold] ⌃A #[fg=#f38ba8#,bg=default#,nobold] ,}#[fg=#45475a,bg=default,nobold]#[fg=#cdd6f4,bg=#45475a] %H:%M  %d/%m #[fg=#45475a,bg=default,nobold] #[fg=#f9e2af,bg=default,nobold]#[fg=#11111b,bg=#f9e2af,bold] #h #[fg=#f9e2af,bg=default,nobold]"

# Бордеры панелей
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

# Сообщения / copy-mode
set -g message-style "bg=#cba6f7,fg=#11111b"
set -g message-command-style "bg=#cba6f7,fg=#11111b"
set -g mode-style "bg=#cba6f7,fg=#11111b"

# === Закрытие без подтверждений ===
# Переопределяем дефолтные confirm-before на прямой kill.
bind x kill-pane
bind & kill-window

# Bell / activity — без визуального шума
set -g bell-action none
set -g visual-bell off
setw -g monitor-activity off
set -g visual-activity off

# === AI-агенты во вкладках: tmux-agent-indicator ==============================
# Иконка агента и точка состояния рисуются в сегменте каждой вкладки скриптом
# ~/.config/tmux/agent-win.sh (подключён выше, в window-status-format).
#
# Состояния running/needs-input/done приходят хуками. Claude, Codex и OpenCode
# получили их от плагинного install.sh; Qwen, Kimi и Hermes прописаны вручную в
# их собственных конфигах (~/.qwen/settings.json, ~/.kimi-code/config.toml,
# ~/.hermes/config.yaml). Детект по процессам остался запасным путём — серый ○
# означает «запущен, но состояние ещё не приходило».
set -s focus-events on                    # нужен плагину для reset-on-focus

set -g @agent-indicator-icons     'claude=🤖,codex=🧠,opencode=💻,qwen=🐉,kimi=🌙,hermes=⚡,default=🤖'
# Детект идёт по ПОЛНОЙ командной строке процессов на tty пана, а не по имени
# процесса — поэтому ловятся и node-обёртки (qwen, codex), и hermes, который
# стартует как `uv run --project ~/.local/share/hermes-agent …`.
set -g @agent-indicator-processes 'claude,codex,opencode,qwen,kimi,hermes'

# Рамка активного пана — по состоянию агента (Catppuccin Mocha).
set -g @agent-indicator-running-border     '#a6e3a1'
set -g @agent-indicator-needs-input-border '#f9e2af'
set -g @agent-indicator-done-border        '#89b4fa'

# Подсветку заголовка окна гасим: плагин красит её через window-status-style,
# а тема выше задаёт цвета инлайн внутри window-status-format — инлайн
# перебивает style, так что толку от неё нет. Пустое значение плагин пропускает.
set -g @agent-indicator-running-window-title-bg ''
set -g @agent-indicator-running-window-title-fg ''
set -g @agent-indicator-needs-input-window-title-bg ''
set -g @agent-indicator-needs-input-window-title-fg ''
set -g @agent-indicator-done-window-title-bg ''
set -g @agent-indicator-done-window-title-fg ''

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'accessd/tmux-agent-indicator'

# tpm — строго последней строкой конфига.
run '~/.tmux/plugins/tpm/tpm'