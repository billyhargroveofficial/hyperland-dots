[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Papirus
# Единый UI-шрифт GTK и Chrome. Отдельного Chrome-профиля намеренно нет:
# браузер наследует это же семейство и начертание вместе с остальной системой.
gtk-font-name=SF Pro Display, Semi-Bold 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
# gtk-application-prefer-dark-theme НЕ ставим: он жёстко прибивает тёмный
# режим и ломает переключение (settings.ini не перечитывается на лету).
# Светлая/тёмная выбирается через gtk-theme-name, который toggle-theme.sh
# держит в синхроне с gsettings org.gnome.desktop.interface gtk-theme.
