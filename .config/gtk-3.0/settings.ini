[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Papirus
# Пропорциональный, а не терминальный моноширинный: отсюда хром берёт шрифт СВОЕГО интерфейса
# (табы, адресная строка, меню), и с моношириной он выглядел сломанным. Своего
# флага на подмену UI-шрифта у хрома нет, gtk-font-name — единственный рычаг,
# поэтому меняется сразу для всех GTK-приложений. Inter установлен локально
# из подписанного пакета Arch inter-font; семейство variable-шрифта так и
# называется — Inter Variable.
gtk-font-name=Inter Variable 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
# gtk-application-prefer-dark-theme НЕ ставим: он жёстко прибивает тёмный
# режим и ломает переключение (settings.ini не перечитывается на лету).
# Светлая/тёмная выбирается через gtk-theme-name, который toggle-theme.sh
# держит в синхроне с gsettings org.gnome.desktop.interface gtk-theme.
