# НЕАКТИВЕН. Обои ставит awww (awww-daemon в exec-once), hyprpaper не
# запускается ниоткуда. Файл оставлен как запасной вариант; чтобы включить —
# добавить `exec-once = hyprpaper` в hyprland.conf и убрать оттуда awww.
#
# Мониторов DP-1 и DP-2 в системе нет, был только они — обе строки не
# применялись бы. Единственный выход — DP-3.
preload = ~/wallsmacos/1.jpg

wallpaper = DP-3,~/wallsmacos/1.jpg

splash = false
