# cship — statusline для Claude Code
# папка ● модель · усилие · контекст ● 5h + таймер ● 7d + таймер
# бинарь: ~/.local/bin/cship   |   референс: https://cship.dev
#
# Цвета — ТОЛЬКО именованные ANSI (blue, cyan, bright-black...), не хексы:
# терминал перекрашивает их палитрой активной gruvbox-темы, и статуслайн
# сам адаптируется к dark/light при переключении по Ctrl+Y.

[cship]
lines = ["$cship.workspace.current_dir[ ● ](fg:bright-black)$cship.model$cship.effort$cship.context_bar$cship.context_window.total_input_tokens[ ● ](fg:bright-black)$cship.usage_limits"]

[cship.workspace]
format = "[$value]($style)"
style  = "fg:blue bold"

[cship.model]
format = "[$value]($style)"
style  = "bold"

[cship.effort]
format = "[ · ](fg:bright-black)[$value]($style)"
style  = "fg:magenta"

[cship.context_bar]
width       = 10
filled_char = "█"
empty_char  = "░"
format      = "[ · ](fg:bright-black)[$value]($style)"
style       = "fg:cyan"
warn_threshold     = 60.0
warn_style         = "fg:yellow"
critical_threshold = 85.0
critical_style     = "fg:red bold"

[cship.usage_limits]
five_hour_format = "5h {pct}% · {reset}"
seven_day_format = "7d {pct}% · {reset}"
separator        = " ● "
style            = "fg:green"
warn_threshold     = 70.0
warn_style         = "fg:yellow"
critical_threshold = 90.0
critical_style     = "fg:red bold"

[cship.context_window.total_input_tokens]
format = "[ · ](fg:bright-black)[$value tok]($style)"
style  = "fg:bright-black"
