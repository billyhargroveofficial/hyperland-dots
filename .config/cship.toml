# cship — statusline для Claude Code
# 📁 папка ● модель окно усилие контекст ● 5h + таймер ● 7d + таймер
# бинарь: ~/.local/bin/cship   |   референс: https://cship.dev
#
# Строку рисует не cship напрямую, а обёртка ~/.local/bin/cship-wrap: она
# правит JSON от Claude Code до того, как он сюда попадёт. Без неё не работают
# три вещи — basename папки, «Opus 5 1M» вместо «Opus 5 (1M context)» и
# сокращение токенов до тысяч. Причины и последствия — в шапке самой обёртки.
#
# Разделители: крупные ● отбивают смысловые блоки, мелких · внутри блоков нет
# намеренно — точки только удлиняли строку.
#
# ВСЯ строка одного цвета и одной жирности — так захотел владелец. Отсюда три
# правила, которые легко нарушить по привычке:
#   1. bold не ставить нигде, даже на папку и модель;
#   2. порогов warn/critical нет вообще — иначе квота на 90% покраснеет и
#      строка снова станет разноцветной. Процент виден цифрой, этого хватает;
#   3. новый модуль добавлять сразу со style = "fg:8".
#
# ================================ ЦВЕТ =======================================
#
# fg:8, а не fg:bright-black. Имя bright-black cship НЕ ЗНАЕТ и молча роняет
# весь стиль — не красит ничем и не ругается. Из-за этого разделители ● и
# счётчик токенов в прежнем конфиге вообще никогда не были серыми, хотя в нём
# так и было написано. Проверено перебором (`[XXX](fg:ИМЯ)` и cat -v):
#
#   работают:  fg:black … fg:white (8 базовых имён), fg:0 … fg:255, dimmed
#   молчат:    bright-black, brightblack, bright_black, grey, gray, fg:dimmed
#
# То есть яркую половину палитры можно задать только НОМЕРОМ: 8 — это и есть
# bright-black. Номер, а не хекс, принципиален — 0..15 берутся из палитры
# терминала, поэтому цвет переключается вместе с темой по Ctrl+Y, а хекс нет.
#
# Почему не честный fg:black: он невидим в ОБЕИХ темах, палитра 0 у них
# заполнена под фон, а не под текст.
#
#            палитра 0 (black)      палитра 8 (bright-black)
#   light    fbf1c7 на фоне f5f0e8  665c54  <- тёмно-серый, читается
#   dark     282828 на фоне 000000  a89984  <- светло-серый, читается

[cship]
lines = ["$cship.workspace.current_dir[ ● ](fg:8)$cship.model$cship.effort$cship.context_window.total_input_tokens[ ● ](fg:8)$cship.usage_limits"]

# $value приходит уже урезанным до имени каталога — режет cship-wrap, своей
# опции для этого у cship нет: truncation_length, basename и truncate_to_repo
# перебраны, неизвестные ключи он молча игнорирует, эффекта ноль.
[cship.workspace]
symbol = "📁 "
format = "[$symbol$value]($style)"
style  = "fg:8"

[cship.model]
format = "[$value]($style)"
style  = "fg:8"

[cship.effort]
format = "[ ](fg:8)[$value]($style)"
style  = "fg:8"

[cship.usage_limits]
five_hour_format = "5h {pct}% {reset}"
seven_day_format = "7d {pct}% {reset}"
separator        = " ● "
style            = "fg:8"

# Букву k дописывает формат: в $value уже лежат тысячи, делит их cship-wrap.
# Поэтому $cship.context_window.used_tokens и $cship.context_bar подставлять в
# lines больше нельзя — они посчитают проценты от тысяч и наврут.
[cship.context_window.total_input_tokens]
format = "[ ](fg:8)[$value]($style)[k]($style)"
style  = "fg:8"
