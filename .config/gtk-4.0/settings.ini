[Settings]
# GTK4/libadwaita берёт светлую/тёмную схему ТОЛЬКО из портала
# (org.freedesktop.appearance color-scheme) через AdwStyleManager.
# gtk-theme-name здесь на цвета не влияет, а gtk-application-prefer-dark-theme
# libadwaita явно не поддерживает и ругается в лог — поэтому его тут нет.
gtk-theme-name=Adwaita
gtk-icon-theme-name=Papirus
# Пропорциональный, а не терминальный моноширинный — см. комментарий в gtk-3.0/settings.ini.
gtk-font-name=Inter Variable 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
