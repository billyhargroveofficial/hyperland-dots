# Список кодеков, которые WirePlumber вообще имеет право согласовывать с
# A2DP-устройством. LDAC исключён намеренно.
#
# Почему. Донгл — TP-Link UB500 на Realtek RTL8761BU (2357:0604, USB 2.0,
# fw 0xdfc6d922). LDAC в верхнем режиме гонит 909-990 кбит/с, и это радио их
# не вывозит: звук в WH-1000XM5 заикался, при этом линк не рвался, поэтому в
# журнале BlueZ было пусто — потери внутри потока он не логирует.
#
# Ровно этот же донгл на Windows работал без нареканий, и это не совпадение:
# инбоксовый A2DP-стек Microsoft не умеет LDAC в принципе (только SBC, плюс AAC
# в Win11), поэтому там наушники всегда играли SBC ~328 кбит/с. То есть железо
# одинаковое, а нагрузка на эфир отличалась втрое — виноват был не адаптер, а
# кодек, который на винде просто не мог включиться.
#
# Приоритеты профилей в PipeWire: LDAC 134 > AAC 133 > SBC 132 > SBC-XQ 131.
# Убрав ldac из этого списка, мы отдаём победу AAC (~256 кбит/с) без ручного
# переключения профиля — оно бы всё равно откатывалось при каждом переподключении.
#
# Если AAC когда-нибудь окажется мало: вернуть "ldac" в массив и добавить
# bluez5.a2dp.ldac.quality = "sq" (660 кбит/с) вместо дефолтного auto.
monitor.bluez.properties = {
  bluez5.codecs = [ "aac", "sbc_xq", "sbc" ]
  bluez5.enable-sbc-xq = true
}
