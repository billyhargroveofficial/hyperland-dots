<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- SF Pro Display — единый системный UI-шрифт. Inter Tight остаётся
       только переносимым fallback на машине без установленного SF Pro. -->
  <!-- Пользовательские правила fontconfig подключаются системным 50-user.conf,
       то есть ДО /etc/fonts/conf.d/60-latin.conf. Одного alias недостаточно:
       поздний 60-latin снова ставит Roboto первым. Strong prepend сохраняет
       SF Pro Display первым кандидатом и оставляет generic fallback ниже. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Display</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Display</string>
    </edit>
  </match>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Display</family>
      <family>Inter Tight</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>SF Pro Display</family>
      <family>Inter Tight</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
