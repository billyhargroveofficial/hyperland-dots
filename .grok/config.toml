[cli]
installer = "internal"

[model.kimi-k3]
model = "k3"
base_url = "https://api.kimi.com/coding/v1"
name = "Kimi K3 1M (Coding Plan)"
description = "Kimi Coding Plan через OpenAI Chat Completions"
env_key = "KIMI_CODING_API_KEY"
api_backend = "chat_completions"
context_window = 1048576

[model.kimi-k3-256k]
model = "k3-256k"
base_url = "https://api.kimi.com/coding/v1"
name = "Kimi K3 256K (Coding Plan)"
description = "Kimi Coding Plan через OpenAI Chat Completions"
env_key = "KIMI_CODING_API_KEY"
api_backend = "chat_completions"
context_window = 262144

[model.qwen-token-plan]
model = "qwen3.7-plus"
base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
name = "Qwen 3.7 Plus (Token Plan)"
description = "Alibaba Cloud Token Plan через OpenAI Responses"
env_key = "BAILIAN_TOKEN_PLAN_API_KEY"
api_backend = "responses"
context_window = 1000000

[model.qwen-max-token-plan]
model = "qwen3.8-max-preview"
base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
name = "Qwen 3.8 Max Preview (Token Plan)"
description = "Alibaba Cloud Token Plan, thinking-only preview"
env_key = "BAILIAN_TOKEN_PLAN_API_KEY"
api_backend = "responses"
context_window = 1000000

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[compat.claude]
skills = false
rules = false
agents = false
mcps = false

[marketplace]
default_skills_installs_purged = true

[models]
default = "qwen-max-token-plan"

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-4.5"
yolo = true
compact_mode = false
permission_mode = "always-approve"
theme = "oscura-midnight"
