# enable_autosuspend — btusb по умолчанию (Y) разрешает USB-автосуспенд
# Bluetooth-адаптеру. Для TP-Link UB500 на этой машине это чистый вред:
# десктоп, от батареи не работает, экономить нечего, а радио засыпает на
# паузах в звуке (/sys/bus/usb/devices/5-1/power/control = auto, задержка
# 2000 мс) и просыпается с задержкой — микрообрывы и заикания.
#
# Это одно из немногих отличий от Windows, где selective suspend для
# BT-радио в таком виде не применяется; оно и делало картину "на винде с
# этим же донглом всё ровно". Второе отличие — кодек, см.
# .config/wireplumber/wireplumber.conf.d/51-bluez-codecs.conf
options btusb enable_autosuspend=0
