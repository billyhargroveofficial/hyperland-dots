# delay — пауза драйвера после каждой записи на шину. Дефолт 60 мс делает
# запись яркости 165-380 мс, причём с деградацией: десять записей подряд
# занимают 3 секунды, очередь растёт, монитор отстаёт, а слайдер в панели
# читает ещё не применённое значение и прыгает назад.
#
# При delay=10 запись стабильно 31-32 мс без деградации: 30 записей подряд
# укладываются в 0.95 с. Замерено на Xiaomi Mi Monitor (VCP 2.1).
#
# Для сравнения: DankMaterialShell вообще не использует этот драйвер, а пишет
# VCP напрямую в /dev/i2c-N через ioctl, не дожидаясь ответа монитора.
options ddcci delay=10
