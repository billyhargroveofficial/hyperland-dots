# Локальный SearXNG backend для mcp-searxng в Qwen Code и Grok Build.
# Слушает только 127.0.0.1:8888. Секрет приходит из
# /etc/searxng/secret.env через переменную SEARXNG_SECRET.

use_default_settings:
  engines:
    keep_only:
      - google cse
      - duckduckgo
      - bing
      - mojeek

engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false

general:
  debug: false
  instance_name: "local"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json
  suspended_times:
    SearxEngineAccessDenied: 600
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 300
    cf_SearxEngineCaptcha: 900
    cf_SearxEngineAccessDenied: 600
    recaptcha_SearxEngineCaptcha: 900

server:
  port: 8888
  bind_address: "127.0.0.1"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

ui:
  static_use_hash: true

valkey:
  url: false
