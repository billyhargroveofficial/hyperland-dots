name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y jq lua5.4 ripgrep zsh
      - name: Validate tracked configs
        run: ./scripts/check-repo.sh
