# tmux-agent-indicator: состояние агента во вкладке tmux

[[hooks]]
event = "UserPromptSubmit"
command = "$HOME/.tmux/plugins/tmux-agent-indicator/scripts/agent-state.sh --agent kimi --state running"
timeout = 5

[[hooks]]
event = "PermissionRequest"
command = "$HOME/.tmux/plugins/tmux-agent-indicator/scripts/agent-state.sh --agent kimi --state needs-input"
timeout = 5

[[hooks]]
event = "Stop"
command = "$HOME/.tmux/plugins/tmux-agent-indicator/scripts/agent-state.sh --agent kimi --state done"
timeout = 5

[[hooks]]
event = "StopFailure"
command = "$HOME/.tmux/plugins/tmux-agent-indicator/scripts/agent-state.sh --agent kimi --state done"
timeout = 5

[[hooks]]
event = "Interrupt"
command = "$HOME/.tmux/plugins/tmux-agent-indicator/scripts/agent-state.sh --agent kimi --state done"
timeout = 5
